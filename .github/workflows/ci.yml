name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check splatfold.py tests
      - run: ruff format --check splatfold.py tests
      - run: python -m pytest
      - run: python -m compileall -q splatfold.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build pip twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the wheel outside the source checkout
        run: |
          python -m venv /tmp/splatfold-wheel
          /tmp/splatfold-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/splatfold-wheel/bin/splatfold --version
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
